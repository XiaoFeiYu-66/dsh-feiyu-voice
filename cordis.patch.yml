# dsh-feiyu-voice 的 bundle 层：向 profile 插入一行 Host 插件。
#
# 必填的只有 ttsHome（TTS 运行目录，见 README）；defaultRef 留空表示
# “还没选音色”，第一次使用前要在设置页或这里填一个参考音频。
# 所有值都可以在这个文件里改，也可以在“设置 → 小肥鱼语音”里改
# （设置页写入 ~/.dsh/feiyu-voice.json，优先级高于这里）。
- insert:
    - id: feiyu-voice
      name: dsh-feiyu-voice
      config:
        # 例：'C:\Users\you\.dsh\tts' 或 '/home/you/.dsh/tts'
        # 留空则回退到环境变量 DSH_FEIYU_TTS_HOME，再回退 ~/.dsh/tts
        ttsHome: ''
        speakdUrl: 'http://127.0.0.1:18084'
        defaultRef: ''
        autoStartDaemon: true
